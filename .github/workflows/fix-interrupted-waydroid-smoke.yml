# One-shot maintenance workflow; removed after it commits the fix.
name: Fix interrupted Waydroid smoke once

on:
  push:
    branches:
      - codex/waydroid-input-bridge

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/waydroid-input-bridge

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Patch stale-session and signal handling
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(text, old, new):
              if old not in text:
                  raise SystemExit(f"missing patch anchor: {old[:80]!r}")
              return text.replace(old, new, 1)

          workspace = Path("Cargo.toml")
          text = workspace.read_text()
          text = replace(text, 'serde_json = "1"\n', 'serde_json = "1"\nsignal-hook = "0.3"\n')
          workspace.write_text(text)

          crate = Path("crates/wroid-inject/Cargo.toml")
          text = crate.read_text()
          text = replace(text, 'evdev.workspace = true\n', 'evdev.workspace = true\nsignal-hook.workspace = true\n')
          crate.write_text(text)

          source = Path("crates/wroid-inject/src/bin/wroid-waydroid-input-smoke.rs")
          text = source.read_text()
          text = replace(
              text,
              'use std::process::{Child, Command, Output, Stdio};\nuse std::thread::sleep;\n',
              'use std::process::{Child, Command, Output, Stdio};\nuse std::sync::atomic::{AtomicBool, Ordering};\nuse std::sync::Arc;\nuse std::thread::sleep;\n',
          )
          text = replace(
              text,
              'use std::time::Duration;\n\nuse wroid_core::Point;\n',
              'use std::time::Duration;\n\nuse signal_hook::consts::{SIGINT, SIGTERM};\nuse signal_hook::flag;\nuse wroid_core::Point;\n',
          )
          text = replace(text, 'const STATUS_ATTEMPTS: usize = 60;', 'const STATUS_ATTEMPTS: usize = 120;')
          text = replace(
              text,
              'fn main() -> Result<(), Box<dyn Error>> {\n    ensure_root()?;\n',
              'fn main() -> Result<(), Box<dyn Error>> {\n    ensure_root()?;\n    let cancelled = install_signal_handlers()?;\n',
          )
          text = replace(text, '    run_smoke()\n}\n\nfn run_smoke() -> Result<(), Box<dyn Error>> {\n    ensure_container_stopped()?;\n    remove_default_bridge()?;\n\n    let desktop_user = DesktopUser::from_sudo_environment()?;\n', '    run_smoke(&cancelled)\n}\n\nfn run_smoke(cancelled: &AtomicBool) -> Result<(), Box<dyn Error>> {\n    let desktop_user = DesktopUser::from_sudo_environment()?;\n    prepare_waydroid_stopped(&desktop_user, cancelled)?;\n    remove_default_bridge()?;\n\n')
          text = replace(text, '    let mut session = DesktopWaydroidSession::start(desktop_user)?;\n', '    let mut session = DesktopWaydroidSession::start(desktop_user, cancelled)?;\n')
          text = replace(text, '    let verification = verify_android_input(&event_node, width, height, &mut engine);\n', '    let verification = verify_android_input(&event_node, width, height, &mut engine, cancelled);\n')
          text = replace(text, '    fn start(user: DesktopUser) -> io::Result<Self> {\n', '    fn start(user: DesktopUser, cancelled: &AtomicBool) -> io::Result<Self> {\n')
          text = replace(text, '        if let Err(error) = session.wait_until_running() {\n', '        if let Err(error) = session.wait_until_running(cancelled) {\n')
          text = replace(text, '    fn wait_until_running(&mut self) -> io::Result<()> {\n        let mut last_status = String::new();\n        for _ in 0..STATUS_ATTEMPTS {\n', '    fn wait_until_running(&mut self, cancelled: &AtomicBool) -> io::Result<()> {\n        let mut last_status = String::new();\n        for _ in 0..STATUS_ATTEMPTS {\n            check_cancelled(cancelled)?;\n')
          text = replace(text, '    engine: &mut TouchEngine<UinputTouchInjector>,\n) -> Result<(), Box<dyn Error>> {\n    wait_for_android_device()?;\n', '    engine: &mut TouchEngine<UinputTouchInjector>,\n    cancelled: &AtomicBool,\n) -> Result<(), Box<dyn Error>> {\n    wait_for_android_device(cancelled)?;\n')
          text = replace(text, 'fn wait_for_android_device() -> io::Result<()> {\n    let mut last_output = String::new();\n    for _ in 0..STATUS_ATTEMPTS {\n', 'fn wait_for_android_device(cancelled: &AtomicBool) -> io::Result<()> {\n    let mut last_output = String::new();\n    println!("Waiting for Android input stack to enumerate {DEVICE_NAME}...");\n    for attempt in 0..STATUS_ATTEMPTS {\n        check_cancelled(cancelled)?;\n')
          text = replace(text, '        if output.status.success() && last_output.contains(DEVICE_NAME) {\n            return Ok(());\n        }\n        sleep(STATUS_INTERVAL);\n', '        if output.status.success() && last_output.contains(DEVICE_NAME) {\n            return Ok(());\n        }\n        if attempt > 0 && attempt % 10 == 0 {\n            println!("Android is still starting; input device not visible yet...");\n        }\n        sleep(STATUS_INTERVAL);\n')
          old = '''fn ensure_container_stopped() -> io::Result<()> {
    let status = waydroid_status()?;
    if container_state(&status) == Some("RUNNING") {
        return Err(io::Error::new(
            io::ErrorKind::AlreadyExists,
            "Waydroid container is running. Stop it first with: waydroid session stop",
        ));
    }
    Ok(())
}
'''
          new = '''fn prepare_waydroid_stopped(user: &DesktopUser, cancelled: &AtomicBool) -> io::Result<()> {
    let status = waydroid_status()?;
    if session_state(&status) == Some("RUNNING") {
        println!("Stopping an existing or stale Waydroid user session...");
        let output = user.command(&["session", "stop"]).output()?;
        if !output.status.success() {
            return Err(io::Error::other(format!(
                "waydroid session stop failed\\n{}",
                combined_output(&output)
            )));
        }
    }

    let status = waydroid_status()?;
    if container_state(&status) == Some("RUNNING") {
        println!("Stopping the existing Waydroid container...");
        run_waydroid(&["container", "stop"])?;
    }

    let mut last_status = String::new();
    for _ in 0..STATUS_ATTEMPTS {
        check_cancelled(cancelled)?;
        last_status = waydroid_status()?;
        if session_state(&last_status) != Some("RUNNING")
            && container_state(&last_status) != Some("RUNNING")
        {
            return Ok(());
        }
        sleep(STATUS_INTERVAL);
    }

    Err(io::Error::new(
        io::ErrorKind::TimedOut,
        format!("Waydroid did not reach a clean stopped state\\n{last_status}"),
    ))
}
'''
          text = replace(text, old, new)
          text = replace(text, 'fn container_state(status: &str) -> Option<&str> {\n', 'fn session_state(status: &str) -> Option<&str> {\n    status.lines().find_map(|line| {\n        let (key, value) = line.split_once(\':\')?;\n        (key.trim() == "Session").then_some(value.trim())\n    })\n}\n\nfn container_state(status: &str) -> Option<&str> {\n')
          text = replace(
              text,
              'fn ensure_root() -> io::Result<()> {\n',
              '''fn install_signal_handlers() -> io::Result<Arc<AtomicBool>> {
    let cancelled = Arc::new(AtomicBool::new(false));
    flag::register(SIGINT, Arc::clone(&cancelled))?;
    flag::register(SIGTERM, Arc::clone(&cancelled))?;
    Ok(cancelled)
}

fn check_cancelled(cancelled: &AtomicBool) -> io::Result<()> {
    if cancelled.load(Ordering::Relaxed) {
        return Err(io::Error::new(
            io::ErrorKind::Interrupted,
            "Waydroid input smoke test interrupted; cleaning up session and bridge",
        ));
    }
    Ok(())
}

fn ensure_root() -> io::Result<()> {
''',
          )
          source.write_text(text)
          PY

          cargo generate-lockfile
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock crates/wroid-inject/Cargo.toml crates/wroid-inject/src/bin/wroid-waydroid-input-smoke.rs
          git commit -m "Recover interrupted Waydroid input smoke tests"
          git push origin HEAD:codex/waydroid-input-bridge
