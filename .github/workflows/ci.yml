name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-quality:
    name: Rust quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Verify Cargo.lock
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Repair Cargo.lock on staging branch
        if: failure() && github.event_name == 'pull_request' && github.head_ref == 'codex/evdev-keyboard-input'
        run: |
          rm -f Cargo.lock
          cargo generate-lockfile
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'Update Cargo.lock for wroid-input'
          git push origin HEAD:${{ github.head_ref }}

      - name: Capture Cargo.lock patch
        if: failure()
        run: |
          cargo generate-lockfile
          git diff --binary -- Cargo.lock > cargo-lock.patch

      - name: Upload Cargo.lock patch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock-patch
          path: cargo-lock.patch
          if-no-files-found: ignore

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Capture rustfmt patch
        if: failure()
        run: |
          cargo fmt --all
          git diff --binary > rustfmt.patch

      - name: Upload rustfmt patch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: rustfmt.patch
          if-no-files-found: ignore

      - name: Run Clippy
        run: |
          set -o pipefail
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings 2>&1 | tee clippy.log

      - name: Upload Clippy log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-log
          path: clippy.log
          if-no-files-found: ignore

      - name: Run tests
        run: cargo test --locked --workspace --all-features
