name: Sync bridge rustfmt once

on:
  push:
    branches:
      - codex/waydroid-input-bridge

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/waydroid-input-bridge

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format and commit Rust sources
        run: |
          cargo fmt --all
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/wroid-inject
          git commit -m "Apply rustfmt to Waydroid input bridge"
          git push origin HEAD:codex/waydroid-input-bridge
