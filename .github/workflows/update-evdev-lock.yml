name: Update evdev lockfile

on:
  push:
    branches:
      - codex/evdev-keyboard-input

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/evdev-keyboard-input

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Regenerate Cargo.lock
        run: |
          rm -f Cargo.lock
          cargo generate-lockfile

      - name: Commit generated lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'Update Cargo.lock for wroid-input'
          git push origin HEAD:codex/evdev-keyboard-input
