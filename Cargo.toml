[workspace]
members = [
    "crates/wroid-core",
    "crates/wroid-adb",
    "crates/wroid-android",
    "crates/wroid-waydroid",
    "crates/wroid-runtime",
    "crates/wroid-input",
    "crates/wroid-inject",
    "crates/wroid-daemon",
    "crates/wroid-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.27"
dbus = "0.9"
evdev = "0.13.2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "1"
