[workspace]
members = [
    "crates/wroid-core",
    "crates/wroid-adb",
    "crates/wroid-waydroid",
    "crates/wroid-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "1"
