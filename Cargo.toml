[workspace]
members = [
    "crates/wroid-core",
    "crates/wroid-adb",
    "crates/wroid-android",
    "crates/wroid-waydroid",
    "crates/wroid-runtime",
    "crates/wroid-input",
    "crates/wroid-inject",
    "crates/wroid-daemon",
    "crates/wroid-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.27"
dbus = "0.9"
evdev = "0.13.2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "1"

# The gameplay hot path runs per input event, so release builds are tuned for
# steady-state latency: whole-program inlining across the reader, runtime, and
# injector crates, and no unwinding machinery in the injection path.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Keep debug builds honest about arithmetic while staying fast enough to run a
# real session for tracing.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
